[build]
  base = "backend"
  publish = "staticfiles"
  command = "pip install -r requirements-deploy.txt && python manage.py collectstatic --noinput && python manage.py migrate"

[build.environment]
  PYTHON_VERSION = "3.11"
  DJANGO_SETTINGS_MODULE = "backend.settings"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/django/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
